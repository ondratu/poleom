[project]
name = "Poleom"
description = "Simple Forum web application"
readme = "README.rst"

authors = [
  {name = "Ondřej Tůma", email = "mcbig@zeropage.cz"},
]
maintainers = [
  {name = "Ondřej Tůma", email = "mcbig@zeropage.cz"},
]

requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
]
dynamic = [
  "version",
]

dependencies = [
  "PoorWSGI",
  "gevent",
  "bcrypt",
  "jinja2_template_info",
  "gevent_mysqldb @ git+https://github.com/axiros/gevent_mysqldb.git",
  "docutils",
  "docutils-tinyhtmlwriter",
  "m2r2",
  "python-dateutil",
  "falias @ git+https://github.com/ondratu/falias.git",
  "simplejson",
]

[project.scripts]
poleom-passwd = "poleom.passwd_bcrypt:main"

[tool.setuptools.dynamic]
version = {attr = "poleom.__version__"}

[tool.setuptools.packages.find]
include = ["poleom*"]

[tool.setuptools]
# Only `package-data` below, no stale files from egg-info/SOURCES.txt.
include-package-data = false

[tool.setuptools.package-data]
# Whitelist by extension, so editor backups (*~) do not get into the package.
"poleom" = [
  "py.typed",
  "assets/**/*.css",
  "assets/**/*.js",
  "assets/**/*.txt",
  "assets/webfonts/*.ttf",
  "assets/webfonts/*.woff2",
  "templates/**/*.html",
  "templates/**/*.jinja",
  "templates/**/*.xml",
  "mysql/*.sql",
  "sqlite/*.sql",
]

[project.urls]
"Repository" = "https://github.com/ondratu/poleom"
"Bug Tracker" = "https://github.com/ondratu/poleom/issues"

[project.optional-dependencies]
lint = [
    "flake8",
    "isort",
    "ruff",
    "pylint",
]

typecheck = [
    "mypy",
    "types-mysqlclient",
    "types_docutils",
    "types-python-dateutil",
]

format = [
    "yapf",
]

test = [
    "pytest",
    "pytest-cov",
    "pytest-doctestplus",
    "pytest-dotenv"
]

server = [
  "uwsgi"
]

dev = [
  "pre-commit",
]

build = [
  "build",
  "twine",
]

[tool.isort]
multi_line_output = 5 # https://pycqa.github.io/isort/docs/configuration/multi_line_output_modes.html#5-hanging-grid-grouped

[tool.yapf]
based_on_style = "pep8"

[tool.ruff]
line-length = 79

lint.select = [
    "F",    # pyflakes
    "E",    # pycodestyle
    "W",    # pycodestyle
    "C90",  # mccabe
    "I",    # isort
    "N",    # pep8-naming
#    "D",    # pydocstyle
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
    # "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    # "BLE",  # flake8-blind-except
    # "FBT",  # flake8-boolean-trap
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    # "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "DJ",   # flake8-django
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "G",    # flake8-logging-format
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SIM",  # flake8-simplify
    # "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "INT",  # flake8-gettext
    "ARG",  # flake8-unused-arguments
    # "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PL",   # Pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "NPY",  # NumPy-specific rules
    "RUF",  # Ruff-specific rules
]

lint.ignore = [
    "S101", # use assert
    "SIM103", # i need readability
    "TRY003", # Avoid specifying long messages outside the exception class
    "SLF001", # Private member accessed - checked by pylint
]

[tool.ruff.lint.per-file-ignores]
# magic values and test passwords are what the tests are about
"tests/**" = ["PLR2004", "S105", "S106"]

[tool.pylint.main]
# unfinished, remove when poleom/wizard.py is done
ignore = ["wizard.py"]

[tool.pylint.'MESSAGES CONTROL']
disable = ["fixme", "too-few-public-methods"]

[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--doctest-plus",
  "--ignore=poleom/main.py",
  "--ignore=poleom/__main__.py",
  "--ignore=poleom/wizard.py",  # unfinished, not imported by the app
  "--cov=poleom",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
]
testpaths = ["poleom", "tests"]

[tool.coverage.run]
source = ["poleom"]
branch = true

[tool.coverage.report]
# A ratchet: raise the number when the coverage grows, never lower it.
# Python versions count the statements differently (3.14 is about 1.3 points
# lower than 3.12), so the number is the lowest of them.
fail_under = 44

[tool.mypy]
# unfinished, remove when poleom/wizard.py is done
exclude = ["poleom/wizard\\.py"]

[tool.codespell]
skip = "*.min.js,*.min.css,*~,*.orig,./.git,./.venv,./build,./dist,./attachments,./poleom/assets/webfonts,./poleom/assets/js/jquery-*,./uv.lock,./LICENSE,./todo.txt"
