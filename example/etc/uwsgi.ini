[uwsgi]
# only valid uWSGI options are tolerated
strict = true

env = app_debug=True
#env = app_smtp=smtps://email@example.net:password@smtp.server.net:465/sender@email.net
env = app_smtp=smtp://localhost/root@localhost
env = app_recipient=mcbig@localhost
env = app_db=mysql://root:root@127.0.0.1/poleom
env = app_secret_key=409810e5b68a00d43eeb225aeed0d013005b798d8a6359805e256d7fa87694de

# plugin = python3
python-path = ./
module = poleom

check-static = ./
