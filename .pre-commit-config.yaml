---
# Third party and generated files are not checked.
exclude: >-
  (?x)^(
    poleom/assets/webfonts/.*
    | poleom/assets/js/jquery-.*
    | .*\.min\.(js|css)
    | uv\.lock
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/codespell-project/codespell
    # Configuration for codespell is in pyproject.toml
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      # includes the flake8-bandit rules (S), no need for bandit
      - id: ruff

  - repo: https://github.com/pycqa/flake8
    rev: 7.5.0
    hooks:
      - id: flake8

  - repo: https://github.com/Lucas-C/pre-commit-hooks-markup
    rev: v1.0.1
    hooks:
      - id: rst-linter

  # pylint and mypy need the dependencies of the project, so they run from
  # the activated virtualenv (`make install`) and always check everything.
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint poleom
        language: system
        types: [python]
        pass_filenames: false
      - id: pylint-tests
        name: pylint (tests)
        entry: pylint --rcfile=tests/.pylintrc tests
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy poleom
        language: system
        types: [python]
        pass_filenames: false
