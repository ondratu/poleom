{# vim:set softtabstop=2: -#}
<h2>Topics:</h2>
<h3>New Topic</h3>

{% if user %}
<form method="post" action="/s/{{ section.title }}">
  <label>
    Title:<br/>
    <input name="title" placeholder="Topic Title" maxlength="255" size="80"/><br/>
  </label>
  <label>
    Post:<br/>
    <textarea name="body" placeholder="First Topic Post" cols="80"></textarea><br/>
  </label>
  <input value="Create" type="submit">
</form>
{% else %}
<p>You have to be log in...</p>
{% endif %}

{% for topic in topics %}
<a href="/s/{{ section.title }}/{{ topic.title }}"><h4>{{ topic.title }}</h4></a>
{{ topic.count }}
{% endfor %}

{% if total == 0 %}
<p>No Topics here...</p>
{% else %}
{% include("_pager.html") %}
{% endif %}
