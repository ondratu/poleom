---
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The release workflow runs the same checks before it builds the release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # gevent_mysqldb builds mysqlclient, which needs the client library
  APT_DEPS: build-essential pkg-config libmariadb-dev

jobs:
  pre-commit:
    name: Pre-commit (format, spelling, ruff, pylint, mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      # pylint and mypy need the project and its dependencies installed
      - name: Install the project and the tools
        run: python -m pip install -e ".[lint,typecheck,test,dev]"
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # to comment the coverage on a pull request
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - name: Install the project
        run: python -m pip install -e ".[test]"
      # fails when the coverage is below `fail_under` in pyproject.toml
      - name: Run tests
        run: python -m pytest

      - name: Check the coverage of every file
        run: python tools/check-coverage.py
      # The table is made even when the tests fail on the threshold
      - name: Make the coverage table
        if: always() && matrix.python == '3.12'
        run: |
          {
            echo "### Test coverage of poleom/"
            echo
            python -m coverage report --format=markdown --fail-under=0
          } > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the table on the pull request
        # Not for pushes (there is no pull request) and not for forks (their
        # token cannot write); the summary of the run has the table anyway.
        if: >
          always() && matrix.python == '3.12'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh pr comment ${{ github.event.pull_request.number }}
          --edit-last --create-if-none --body-file coverage.md
      - name: Upload coverage
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.md
          retention-days: 30

  package:
    name: Build and check the wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check the content of the wheel
        run: tools/check-wheel.sh dist/*.whl
      - name: Install the wheel into a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/poleomctl" --help
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30
          if-no-files-found: error
