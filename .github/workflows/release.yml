---
name: Release

# Publishing a release (a tag `vX.Y.Z`) tests the code, builds the wheel and
# the source package and attaches them to the release. The packages are not
# uploaded to PyPI, which does not accept the dependencies installed from Git.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    name: Checks and tests
    uses: ./.github/workflows/ci.yml
    # a called workflow can not have more permissions than the caller gives
    permissions:
      contents: read
      pull-requests: write

  release:
    name: Attach the packages to the release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag, the version and the ChangeLog
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' poleom/__init__.py)
          [ "$TAG" = "v$version" ] \
            || { echo "Tag $TAG does not match version $version" >&2; exit 1; }
          grep -q "^$version - " ChangeLog.rst \
            || { echo "ChangeLog.rst has no section $version" >&2; exit 1; }
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          tools/check-wheel.sh dist/*.whl
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$REPO"
